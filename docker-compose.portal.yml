# Uso en el Mac Mini:
#   docker compose -f docker-compose.yml -f docker-compose.portal.yml up -d --build
# Conecta ambos contenedores a la red del auth-proxy de darc3 para que Caddy
# los alcance por nombre y AIdentity inyecte las cabeceras X-Auth-*.
services:
  hub-api:
    networks: [hub, auth-proxy_default, supabase_default]
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD}@supabase-db:5432/postgres
      DATABASE_SCHEMA: ai_learn
      REQUIRE_PORTAL_AUTH: "true"
      COACH_ENABLED: "true"
      OLLAMA_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: gemma4:e2b

  hub-web:
    networks: [hub, auth-proxy_default]

networks:
  auth-proxy_default:
    external: true
  supabase_default:
    external: true
