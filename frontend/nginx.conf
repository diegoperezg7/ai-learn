server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 512;

    # Hashed assets are immutable; index.html must never be cached.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # API lives on the backend container.
    location /api/ {
        proxy_pass http://hub-api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Portal identity headers injected by the darc3 auth-proxy
        proxy_set_header X-Auth-User $http_x_auth_user;
        proxy_set_header X-Auth-Email $http_x_auth_email;
        proxy_set_header X-Auth-Role $http_x_auth_role;
        proxy_read_timeout 180s;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
