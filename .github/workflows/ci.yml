
name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: self-hosted

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Comprobar frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Comprobar Docker Compose
        run: docker compose config

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: self-hosted

    steps:
      - name: Descargar código para desplegar
        uses: actions/checkout@v4

      - name: Reconstruir y arrancar la aplicación
        working-directory: ${{ github.workspace }}
        run: |
          docker compose -f docker-compose.yml -f docker-compose.portal.yml up -d --build --force-recreate
          docker compose -f docker-compose.yml -f docker-compose.portal.yml ps
          docker inspect hub-web --format '{{json .NetworkSettings.Networks}}' | grep -q 'edge-hub'
          docker inspect hub-api --format '{{json .NetworkSettings.Networks}}' | grep -q 'edge-hub'
          for attempt in $(seq 1 30); do
            docker exec hub-web wget -qO- http://127.0.0.1/ >/dev/null 2>&1 && \
            docker exec hub-api curl -fsS http://127.0.0.1:8000/api/health >/dev/null 2>&1 && break
            test "$attempt" -eq 30 && exit 1
            sleep 2
          done
