name: CI/CD

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # Untrusted pull request code must not run on the self-hosted runner.
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Check Docker Compose
        run: docker compose config

  deploy:
    # Production only, from the canonical repository on main: on push, or a manual
    # run started by the owner. Pull requests and forks never reach this runner.
    if: >-
      github.repository == 'diegoperezg7/ai-learn' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && github.actor == github.repository_owner))
    needs: validate
    runs-on: self-hosted

    steps:
      - name: Checkout for deploy
        uses: actions/checkout@v4

      - name: Rebuild and start the application
        working-directory: ${{ github.workspace }}
        env:
          # Rotated Postgres password. Settings → Secrets → POSTGRES_PASSWORD.
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          docker compose -f docker-compose.yml -f docker-compose.portal.yml up -d --build --force-recreate
          docker compose -f docker-compose.yml -f docker-compose.portal.yml ps
          docker inspect hub-web --format '{{json .NetworkSettings.Networks}}' | grep -q 'edge-hub'
          docker inspect hub-api --format '{{json .NetworkSettings.Networks}}' | grep -q 'edge-hub'
          for attempt in $(seq 1 30); do
            docker exec hub-web wget -qO- http://127.0.0.1/ >/dev/null 2>&1 && \
            docker exec hub-api curl -fsS http://127.0.0.1:8000/api/health >/dev/null 2>&1 && break
            test "$attempt" -eq 30 && exit 1
            sleep 2
          done
